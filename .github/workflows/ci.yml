# Push / PR gate (LIBRARY_CONVENTIONS §5): npm ci → typecheck → build:types → test.
# No lint step — tsc (checkJs + strictNullChecks) already catches the bug class
# that matters, and pulling in the ESLint ecosystem cuts against the dependency
# hierarchy for a small vanilla-ESM lib. The publish workflow gates the same way.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build types
        run: npm run build:types
      - name: Adopter-visible declarations
        # Checks a PROPERTY of the whole shipped surface (no bare `object` returns;
        # the two platform pages agree on the methods they share; and every page
        # member squares with its own source — what it forwards to, and what its
        # body does when an argument is missing), rather than the handful of
        # methods a hand-written quickstart happens to call. See the header of
        # scripts/check-adopter-types.mjs for what it still cannot catch.
        run: npm run check:types
      - name: Test
        run: npm test
